[project]
name = "extraction-api"
version = "0.1.0"
description = "Extraction API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/extraction_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=extraction_api --cov-report=term-missing"

[tool.mypy]
strict = true
files = ["src", "tests"]
